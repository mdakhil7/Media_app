android {
    namespace = "com.beingbetter.food_app"
    compileSdk = 34  // Ensure latest SDK version
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // ⬅ Change from 1.8 to 17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17" // ⬅ Change from 1.8 to 17
    }

    defaultConfig {
        applicationId = "com.beingbetter.food_app"
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        multiDexEnabled true  // ✅ Enable MultiDex (if needed)
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}


flutter {
    source = "../.."
}


dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'  // ✅ Added MultiDex
}

apply plugin: 'com.google.gms.google-services'
